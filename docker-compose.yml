services:
  web:
    build: .
    container_name: wahsvault-web
    restart: unless-stopped
    environment:
      - PORT=80
      - MEDIA_ROOT=/media
    volumes:
      - ./media:/media:rw
    networks:
      - wahsvault
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wahsvault-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - wahsvault

networks:
  wahsvault:
    driver: bridge
